<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CMS Admin</title>

<!-- TinyMCE -->
<script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js"></script>

<!-- SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f1f1;
}

.topbar{
  height:50px;
  background:#23282d;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.sidebar{
  width:220px;
  background:#2c3338;
  height:100vh;
  position:fixed;
  top:50px;
  left:0;
  padding-top:20px;
}

.sidebar a{
  display:block;
  padding:12px 20px;
  color:#eee;
  text-decoration:none;
}

.sidebar a:hover{
  background:#0073aa;
}

.main{
  margin-left:220px;
  margin-top:50px;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:6px;
}

button{
  padding:8px 12px;
  background:#0073aa;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover{
  background:#005177;
}

input, textarea{
  width:100%;
  padding:8px;
  margin:5px 0;
}

.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  width:400px;
  border-radius:8px;
}

.dark{
  background:#1e1e1e;
  color:white;
}

.dark .card{
  background:#2b2b2b;
  color:white;
}

.block{
  padding:10px;
  background:#ddd;
  margin:5px 0;
  cursor:move;
}
</style>
</head>
<body>

<div class="topbar">
  <div>My CMS Admin</div>
  <button onclick="toggleDark()">🌙</button>
</div>

<div class="sidebar">
  <a onclick="showSection('dashboard')">Dashboard</a>
  <a onclick="showSection('products')">Products</a>
  <a onclick="showSection('categories')">Categories</a>
  <a onclick="showSection('homepage')">Homepage</a>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="section">
  <div class="card">
    <h2>Welcome Admin</h2>
  </div>
</div>

<!-- PRODUCTS -->
<div id="products" class="section" style="display:none;">
  <div class="card">
    <h2>Add Product</h2>
    <input type="text" id="name" placeholder="Product Name">
    <textarea id="description" placeholder="Description"></textarea>
    <input type="number" id="price" placeholder="Price">
    <input type="file" id="image">
    <button onclick="addProduct()">Add Product</button>
  </div>

  <div class="card">
    <h2>All Products</h2>
    <div id="productList"></div>
  </div>
</div>

<!-- CATEGORIES -->
<div id="categories" class="section" style="display:none;">
  <div class="card">
    <h2>Add Category</h2>
    <input type="text" id="categoryName">
    <button onclick="addCategory()">Add</button>
    <div id="categoryList"></div>
  </div>
</div>

<!-- HOMEPAGE -->
<div id="homepage" class="section" style="display:none;">
  <div class="card">
    <h2>Homepage Editor</h2>
    <textarea id="homepageContent"></textarea>
    <button onclick="saveHomepage()">Save</button>
  </div>

  <div class="card">
    <h2>Drag & Drop Page Builder</h2>
    <div id="pageBuilder">
      <div class="block">Hero Section</div>
      <div class="block">Services Section</div>
      <div class="block">Testimonials</div>
    </div>
  </div>
</div>

</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit Product</h3>
    <input type="text" id="editName">
    <textarea id="editDescription"></textarea>
    <input type="number" id="editPrice">
    <button onclick="saveEdit()">Save</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script type="module">

import { 
  onAuthChange,
  getProducts,
  addProductFirebase,
  deleteProduct,
  updateProduct,
  getCategories,
  addCategoryFirebase,
  uploadImage,
  saveHomepageFirebase,
  getHomepage,
  getUserRole
} from '../firebase.js';

onAuthChange(async user=>{
  if(!user) window.location.href="../login.html";

  const role = await getUserRole(user.uid);
  if(role !== "admin"){
    alert("Access Denied");
    window.location.href="/";
  }
});

/* TinyMCE */
tinymce.init({
  selector:'#homepageContent',
  height:300
});

/* Drag & Drop */
new Sortable(document.getElementById("pageBuilder"), {
  animation:150
});

window.showSection = (id)=>{
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
};

window.toggleDark = ()=>{
  document.body.classList.toggle("dark");
};

/* PRODUCTS */

const productList = document.getElementById("productList");
let editingId = null;

async function loadProducts(){
  productList.innerHTML="";
  const snapshot = await getProducts();
  snapshot.forEach(doc=>{
    const data = doc.data();
    productList.innerHTML += `
      <div>
        <strong>${data.name}</strong> - $${data.price}
        <br><img src="${data.imageURL}" width="80">
        <br>
        <button onclick='openEdit("${doc.id}", ${JSON.stringify(data)})'>Edit</button>
        <button onclick='deleteProduct("${doc.id}").then(loadProducts)'>Delete</button>
        <hr>
      </div>
    `;
  });
}
loadProducts();

window.addProduct = async ()=>{
  const file = document.getElementById("image").files[0];
  const imageURL = await uploadImage(file);

  await addProductFirebase({
    name: name.value,
    description: description.value,
    price: parseFloat(price.value),
    imageURL
  });

  loadProducts();
};

window.openEdit = (id,data)=>{
  editingId=id;
  editName.value=data.name;
  editDescription.value=data.description;
  editPrice.value=data.price;
  editModal.style.display="flex";
};

window.closeModal=()=>{
  editModal.style.display="none";
};

window.saveEdit=async()=>{
  await updateProduct(editingId,{
    name:editName.value,
    description:editDescription.value,
    price:parseFloat(editPrice.value)
  });
  closeModal();
  loadProducts();
};

/* CATEGORIES */

async function loadCategories(){
  const snapshot=await getCategories();
  categoryList.innerHTML="";
  snapshot.forEach(doc=>{
    categoryList.innerHTML+=`<div>${doc.data().name}</div>`;
  });
}
loadCategories();

window.addCategory=async()=>{
  await addCategoryFirebase({name:categoryName.value});
  loadCategories();
};

/* HOMEPAGE */

window.saveHomepage=async()=>{
  const content=tinymce.get("homepageContent").getContent();
  await saveHomepageFirebase({content});
};

async function loadHomepage(){
  const data=await getHomepage();
  if(data) tinymce.get("homepageContent").setContent(data.content);
}
loadHomepage();

</script>

</body>
</html>
